<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nation First — உறுப்பினர் பதிவு</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="form-wrapper">

    <!-- Header -->
    <div class="form-header">
      <h1 class="org-title">Nation First Organization</h1>
      <p class="org-sub" data-ta="நிறுவப்பட்டது — 14/04/2026" data-en="ESTABLISHED — 14/04/2026"></p>
      <div class="lang-toggle">
        <button id="btn-ta" class="lang-btn active" onclick="setLang('ta')">தமிழ்</button>
        <button id="btn-en" class="lang-btn" onclick="setLang('en')">English</button>
      </div>
    </div>

    <!-- Success message -->
    <div id="success-msg" class="success-msg hidden">
      <span class="check">✓</span>
      <p data-ta="உங்கள் பதிவு வெற்றிகரமாக சமர்ப்பிக்கப்பட்டது!" data-en="Your registration was submitted successfully!"></p>
    </div>

    <form id="registration-form" novalidate>

      <!-- Name -->
      <div class="field">
        <label for="name">
          <span data-ta="பெயர்" data-en="Name"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="name" name="name" required autocomplete="name" />
        <span class="err" id="err-name"></span>
      </div>

      <!-- Father's Name -->
      <div class="field">
        <label for="father_name">
          <span data-ta="தந்தையின் பெயர்" data-en="Father's Name"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="father_name" name="father_name" required />
        <span class="err" id="err-father_name"></span>
      </div>

      <!-- Gender -->
      <div class="field">
        <label>
          <span data-ta="பாலினம்" data-en="Gender"></span>
          <span class="req">*</span>
        </label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="gender" value="Male" required />
            <span data-ta="ஆண்" data-en="Male"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="gender" value="Female" />
            <span data-ta="பெண்" data-en="Female"></span>
          </label>
        </div>
        <span class="err" id="err-gender"></span>
      </div>

      <!-- Education -->
      <div class="field">
        <label>
          <span data-ta="கல்வித் தகுதி" data-en="Education Qualification"></span>
          <span class="req">*</span>
        </label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="education" value="High School" required />
            <span data-ta="உயர்நிலைப் பள்ளி" data-en="High School"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="education" value="Under Graduate" />
            <span data-ta="இளங்கலை" data-en="Under Graduate"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="education" value="Post Graduate" />
            <span data-ta="முதுகலை" data-en="Post Graduate"></span>
          </label>
        </div>
        <span class="err" id="err-education"></span>
      </div>

      <!-- Occupation -->
      <div class="field">
        <label>
          <span data-ta="நீங்கள் யார்?" data-en="Are you a?"></span>
          <span class="req">*</span>
        </label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="occupation" value="Student" required />
            <span data-ta="மாணவர்" data-en="Student"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="occupation" value="Private Employee" />
            <span data-ta="தனியார் ஊழியர்" data-en="Private Employee"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="occupation" value="Business" />
            <span data-ta="வணிகர்" data-en="Business"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="occupation" value="Government Employee" />
            <span data-ta="அரசு ஊழியர்" data-en="Government Employee"></span>
          </label>
          <label class="radio-label">
            <input type="radio" name="occupation" value="Other" />
            <span data-ta="மற்றவை" data-en="Other"></span>
          </label>
        </div>
        <span class="err" id="err-occupation"></span>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">
          <span data-ta="மின்னஞ்சல்" data-en="Email"></span>
          <span class="req">*</span>
        </label>
        <input type="email" id="email" name="email" required autocomplete="email" />
        <span class="err" id="err-email"></span>
      </div>

      <!-- Contact Number -->
      <div class="field">
        <label for="phone">
          <span data-ta="தொடர்பு எண்" data-en="Contact Number"></span>
          <span class="req">*</span>
        </label>
        <input type="tel" id="phone" name="phone" required maxlength="10" pattern="[6-9][0-9]{9}"
               placeholder="10-digit mobile number" autocomplete="tel" />
        <span class="err" id="err-phone"></span>
      </div>

      <!-- Pincode -->
      <div class="field">
        <label for="pincode">
          <span data-ta="அஞ்சல் குறியீடு" data-en="Pincode"></span>
          <span class="req">*</span>
        </label>
        <div class="pincode-row">
          <input type="text" id="pincode" name="pincode" required maxlength="6" pattern="[0-9]{6}"
                 placeholder="6-digit pincode" inputmode="numeric" />
          <span id="pincode-loader" class="pincode-loader hidden"></span>
        </div>
        <span class="err" id="err-pincode"></span>
      </div>

      <!-- State (auto-filled) -->
      <div class="field">
        <label for="state">
          <span data-ta="மாநிலம்" data-en="State"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="state" name="state" required readonly class="autofilled" />
        <span class="err" id="err-state"></span>
      </div>

      <!-- District (auto-filled, editable) -->
      <div class="field">
        <label for="district">
          <span data-ta="மாவட்டம்" data-en="District"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="district" name="district" required class="autofilled editable" />
        <span class="autofill-hint hidden" id="district-hint" data-ta="தானாக நிரப்பப்பட்டது — தேவைப்பட்டால் திருத்தவும்" data-en="Auto-filled — edit if needed"></span>
        <span class="err" id="err-district"></span>
      </div>

      <!-- MLA Constituency (auto-filled, editable) -->
      <div class="field">
        <label for="mla_constituency">
          <span data-ta="உங்கள் சட்டமன்ற தொகுதி (MLA)" data-en="Your MLA Constituency"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="mla_constituency" name="mla_constituency" required class="autofilled editable" />
        <span class="autofill-hint hidden" id="mla-hint" data-ta="தானாக நிரப்பப்பட்டது — தேவைப்பட்டால் திருத்தவும்" data-en="Auto-filled — edit if needed"></span>
        <span class="err" id="err-mla_constituency"></span>
      </div>

      <!-- MP Constituency (auto-filled, editable) -->
      <div class="field">
        <label for="mp_constituency">
          <span data-ta="உங்கள் நாடாளுமன்றத் தொகுதி (MP)" data-en="Your MP Constituency"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="mp_constituency" name="mp_constituency" required class="autofilled editable" />
        <span class="autofill-hint hidden" id="mp-hint" data-ta="தானாக நிரப்பட்டது — தேவைப்பட்டால் திருத்தவும்" data-en="Auto-filled — edit if needed"></span>
        <span class="err" id="err-mp_constituency"></span>
      </div>

      <!-- Address -->
      <div class="field">
        <label for="address">
          <span data-ta="முகவரி" data-en="Address"></span>
          <span class="req">*</span>
        </label>
        <textarea id="address" name="address" required rows="3"></textarea>
        <span class="err" id="err-address"></span>
      </div>

      <!-- Date of Joining -->
      <div class="field">
        <label for="doj">
          <span data-ta="இணையும் தேதி" data-en="Date of Joining"></span>
          <span class="req">*</span>
        </label>
        <input type="date" id="doj" name="doj" required />
        <span class="err" id="err-doj"></span>
      </div>

      <!-- Who referred you -->
      <div class="field">
        <label for="referred_by">
          <span data-ta="உங்களை யார் அறிமுகப்படுத்தினார்கள்?" data-en="Who referred you?"></span>
          <span class="req">*</span>
        </label>
        <input type="text" id="referred_by" name="referred_by" required />
        <span class="err" id="err-referred_by"></span>
      </div>

      <!-- How can you develop -->
      <div class="field">
        <label for="develop_plan">
          <span data-ta="நேஷன் ஃபர்ஸ்டை இந்தியா முழுவதும் எவ்வாறு வளர்க்கலாம்?" data-en="How can you develop Nation First all over India?"></span>
          <span class="req">*</span>
        </label>
        <textarea id="develop_plan" name="develop_plan" required rows="4"></textarea>
        <span class="err" id="err-develop_plan"></span>
      </div>

      <!-- Declaration -->
      <div class="field declaration">
        <p class="declaration-text" data-ta="நான் நேஷன் ஃபர்ஸ்டில் இணைய விரும்புகிறேன், மேலும் நமது நாடு மற்றும் இந்து மக்களை முழுமையாக ஆதரிப்பேன். நமது நாட்டிற்கோ அல்லது இந்து மதத்திற்கோ எதிராக ஒருபோதும் செயல்படமாட்டேன் என்று உறுதியளிக்கிறேன்."
          data-en="I am willing to join Nation First and fully support our country and Hindu people. I promise to never act against our Country or our Hindu Religion.">
        </p>
        <label class="checkbox-label">
          <input type="checkbox" id="agree" name="agree" required />
          <span data-ta="ஒப்புக்கொள்கிறேன்" data-en="I Agree"></span>
        </label>
        <span class="err" id="err-agree"></span>
      </div>

      <!-- Submit -->
      <div class="field submit-field">
        <button type="submit" id="submit-btn" class="submit-btn">
          <span id="submit-text" data-ta="பதிவு செய்யவும்" data-en="Submit Registration"></span>
          <span id="submit-loader" class="hidden">⏳</span>
        </button>
      </div>

    </form>
  </div>

  <script src="data/constituencies.js"></script>
  <script src="script.js"></script>
</body>
</html>
